<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Listen in Your Language</title>
  <link rel="icon" type="image/x-icon" href="/static/logo.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Preserved original styling */
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e5e5e5;
      --primary: #3399ff;
      --primary-hover: #62b2ff;
      --border-color: #333;
      --shadow: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex; align-items: center; justify-content: center; height: 100vh;
    }
    .card {
      background-color: var(--card-bg);
      box-shadow: 0 8px 25px var(--shadow);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 90%; max-width: 380px; padding: 2rem; text-align: center;
    }
    h2 { margin-top: 0; margin-bottom: 1.5rem; font-size: 1.6rem; color: var(--primary); }
    button, select {
      display: block; width: 100%; margin-bottom: 0.75rem; padding: 0.75rem;
      font-size: 1rem; border-radius: 8px; border: none; cursor: pointer;
    }
    button { background-color: var(--primary); color: white; font-weight: 600; }
    button:disabled { background-color: #555; cursor: not-allowed; }
    select {
      border: 1px solid var(--border-color); background-color: transparent; color: var(--text-color);
    }
    audio { margin-top: 1.25rem; width: 100%; outline: none; }
    #status { margin-top: 1rem; font-size: 0.95rem; opacity: 0.9; }
    footer { margin-top: 1.5rem; font-size: 0.85rem; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Listen in Your Language</h2>
    <button id="refresh">Show Available Channels</button>
    <select id="channels"></select>
    <button id="join">Join Channel</button>
    <button id="leave" disabled>Leave</button>
    <div id="status">Ready</div>
    <audio id="audio" controls autoplay playsinline></audio>
    <footer>9MCLC Tech Ministry • Live Listening</footer>
  </div>

  <script src="/static/client.js"></script>
</body>
</html>
